[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crunch_llm"
version = "0.1.0"
description = "Project Athena LLM tools"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
 # --- LLM & LangChain Dependencies ---
    "langchain",
    "langchain-anthropic",
    "langchain-chroma",
    "langchain-google-genai",
    "langchain-ollama",
    "langchain-openai",
    "langchain-text-splitters",
    "langchain-xai",
    "langsmith",
    "langchain-community",
    "langgraph",
    "langgraph-checkpoint",
    "langgraph-prebuilt",
    "langgraph-sdk",

    # --- Model SDKs ---
    "anthropic",
    "google-generativeai",  # Gemini
    "google-genai",
    "openai",
    "ollama",

    # --- Vector Database ---
    "chromadb",

    # --- App & API Frameworks ---
    "fastapi",
    "uvicorn",
    "streamlit",

    # --- Data & Utilities ---
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "numpy",
    "pandas",
    "pypdf",
    "torch",

    # --- HTTP / Serialization / Common Utilities ---
    "requests",
    "httpx",
    "orjson",
    "PyYAML",
    "SQLAlchemy",
    "rich",
    "tqdm",
    "tenacity",
    "backoff",

    # --- Google API Client Stack (if you use google-api-python-client) ---
    "google-api-python-client",
    "google-auth",
    "google-auth-httplib2",
    "httplib2",

    # --- Scientific / Plotting (only if you import them directly) ---
    "scipy",
    "matplotlib",
    "sympy",
    "pyarrow",
    "pillow",

    # --- Tokenization / HF (only if you import them directly) ---
    "tiktoken",
    "tokenizers",
    "huggingface_hub",

    # --- Geometry / Visualization (only if you import them directly) ---
    "gmsh",
    "pyvista",
    "vtk",

    # --- Git tooling (only if you import it directly) ---
    "GitPython",

    # --- Notebook display and PDF reports (imported by crunch_llm/code/utils.py) ---
    "ipython",
    "reportlab",

    # --- Vision (only if you import it directly) ---
    "torchvision",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crunch_llm*"]
exclude = ["Ablation_studies", "Conceptualization_team"]