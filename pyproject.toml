[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crunch_llm"
version = "0.1.0"
description = "Project Athena LLM tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- Strict LLM & LangChain Dependencies ---
    "langchain==0.3.27",
    "langchain-anthropic==0.3.22",
    "langchain-chroma==0.2.6",
    "langchain-google-genai==2.0.4",
    "langchain-ollama==0.3.10",
    "langchain-openai==0.3.35",
    "langchain-text-splitters==0.3.11",
    "langsmith==0.4.38",

    # --- Model SDKs (Strict) ---
    "anthropic==0.74.1",
    "google-generativeai==0.8.5", # Gemini
    "openai==2.6.1",
    "ollama==0.6.0",

    # --- Vector Database ---
    "chromadb==1.2.2",

    # --- App & API Frameworks ---
    "fastapi==0.120.1",
    "uvicorn==0.38.0",
    "streamlit==1.51.0",

    # --- Data & Utilities ---
    "pydantic==2.12.3",
    "pydantic-settings==2.11.0",
    "python-dotenv==1.2.1",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "pypdf==6.1.3",
    "torch>=2.0.0" 
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crunch_llm*"]
exclude = ["Ablation_studies", "Conceptualization_team"]