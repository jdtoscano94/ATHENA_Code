[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crunch_llm"
version = "0.1.0"
description = "Project Athena LLM tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- LLM & LangChain Dependencies ---
    "langchain",
    "langchain-anthropic",
    "langchain-chroma",
    "langchain-google-genai",
    "langchain-ollama",
    "langchain-openai",
    "langchain-text-splitters",
    "langchain-xai",
    "langsmith",

    # --- Model SDKs ---
    "anthropic",
    "google-generativeai",  # Gemini
    "openai",
    "ollama",

    # --- Vector Database ---
    "chromadb",

    # --- App & API Frameworks ---
    "fastapi",
    "uvicorn",
    "streamlit",

    # --- Data & Utilities ---
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "numpy",
    "pandas",
    "pypdf",
    "torch"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crunch_llm*"]
exclude = ["Ablation_studies", "Conceptualization_team"]